cv:
  name: Edwin González Bolívar
  label: Tecnólogo y Estudiante de Ingeniería en Electrónica (ITM) | Especialista Técnico Industrial
  location: Medellín, Antioquia, Colombia
  image: ""
  summary: Tecnólogo en Electrónica y estudiante de Ingeniería en Electrónica en la Institución Universitaria ITM, con más de 10 años de experiencia en MECYS S.A.S. en diagnóstico eléctrico y electrónico, mantenimiento de maquinaria industrial de impresión digital y termofijación, gestión de perfiles de color con NeoStampa y RasterLink, y control en sistemas embebidos (ESP32) y PLC. Participación en 10 ediciones de Colombiatex y ferias del sector como Inexmoda y Nextech.

  social_networks:
    - network: GitHub
      username: edwinGonzalezB

  address:
    city: Medellín
    region: Antioquia
    countryCode: CO

  sections:
    Educación:
      - institution: Institución Universitaria ITM
        area: Ingeniería en Electrónica
        degree: Pregrado
        location: Medellín, Colombia
        start_date: 2016-08
        end_date: present
        summary: Formación en electrónica de potencia, máquinas eléctricas, matemáticas especiales y control aplicado.
        highlights:
          - Proyecto integrador de convertidor DC-DC Boost sincrónico de 75 W (12 V a 36 V) con control PI en cascada en ESP32.
      - institution: Institución Universitaria ITM
        area: Tecnología en Electrónica
        degree: Tecnólogo en Electrónica
        location: Medellín, Colombia
        start_date: 2013-06
        end_date: 2016-06
        summary: Formación tecnológica con proyectos académicos y prácticos en asignaturas como PLC, control, instrumentación y electrónica industrial.

    Experiencia:
      - company: MECYS S.A.S.
        position: Técnico Especialista en Maquinaria Industrial y Perfiles de Color
        location: Medellín, Colombia
        start_date: 2016-08
        end_date: present
        summary: Más de 10 años de experiencia en diagnóstico eléctrico y electrónico, mantenimiento de maquinaria industrial de impresión y calandras, perfilación de color y soporte en ferias del sector.
        highlights:
          - Técnico certificado en equipos de impresión Mimaki y software RasterLink, así como en maquinaria MS Italy y Monti Antonio SpA.
          - Técnico capacitado en equipos Fedar y Flora, y especialista en realización de perfiles de color para múltiples marcas y operación de NeoStampa.
          - Participación en 10 ediciones de Colombiatex y ferias como Inexmoda y Nextech, apoyando demostraciones técnicas, puesta a punto y soluciones de producción.
          - Diagnóstico de fallas eléctricas, electrónicas, neumáticas y de control en impresoras de gran formato, calandras térmicas y sistemas con PLC.

    Proyectos:
      - name: Convertidor DC-DC Boost Sincrónico de 75 W (12 V a 36 V) con Control en Doble Lazo
        start_date: 2026-08
        end_date: 2026-11
        summary: Trabajo integrador de Electrónica de Potencia (EPW103-1, ITM) basado en modelado en espacio de estados, simulación en MATLAB/PSIM e implementación digital en ESP32.
        highlights:
          - Lazos PI discretos multirrata en ESP32 (Núcleo 1 para control en corriente y tensión; Núcleo 0 para telemetría) mitigando el cero en el semiplano derecho (RHPZ).
          - Validación experimental en banco de pruebas con etapa sincrónica IRFZ44N, driver IR2110, sensor ACS712 y mediciones en osciloscopio R&S RTC1002.

    Habilidades:
      - name: Perfil Profesional y Trabajo en Equipo
        keywords:
          - Aprendizaje continuo y capacitación constante
          - Toma de decisiones activa en campo y taller
          - Trabajo en equipo y escucha activa de opiniones
          - Enfoque metódico y comunicación efectiva
          - Capacidad física para transporte de maquinaria y desmontajes
      - name: Maquinaria de Impresión, Calandras y Colorimetría
        keywords:
          - Técnico certificado en equipos Mimaki y software RasterLink
          - Técnico certificado en maquinaria MS Italy y Monti Antonio SpA
          - Técnico capacitado en equipos Fedar y Flora
          - Elaboración de perfiles de color multimarca y manejo de NeoStampa
          - Diagnóstico eléctrico, electrónico, neumático y de control
      - name: Electrónica, Control y Sistemas Embebidos
        keywords:
          - Tecnólogo en Electrónica y estudiante de Ingeniería en Electrónica (ITM)
          - Desarrollo de proyectos con PLC y control aplicado
          - Modelado en espacio de estados y control PI/PID en ESP32 (FreeRTOS y PWM)
          - Simulación y análisis en MATLAB (sisotool) y PSIM
