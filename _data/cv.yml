cv:
  name: Edwin González Bolívar
  label: Estudiante de Ingeniería en Electrónica | Especialista Técnico Industrial
  location: Medellín, Antioquia, Colombia
  image: ""
  summary: Estudiante de Ingeniería en Electrónica en la Institución Universitaria ITM con enfoque en electrónica de potencia, control aplicado y sistemas embebidos en tiempo real (ESP32), respaldado por experiencia práctica en diagnóstico eléctrico, mantenimiento de maquinaria industrial de gran formato y gestión de color.

  social_networks:
    - network: GitHub
      username: edwinGonzalezB

  address:
    city: Medellín
    region: Antioquia
