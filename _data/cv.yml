    Experience:
      - company: MECYS S.A.S.
        position: Técnico Especialista en Maquinaria Industrial y Perfiles de Color
        location: Medellín, Colombia
        start_date: 2015-01
        end_date: present
        summary: Más de 10 años de experiencia en diagnóstico eléctrico y electrónico, mantenimiento de maquinaria industrial de impresión y calandras, perfilación de color y soporte en ferias del sector.
        highlights:
          - Técnico certificado en equipos de impresión Mimaki y software RasterLink, así como en maquinaria MS Italy y Monti Antonio SpA.
          - Técnico capacitado en equipos Fedar y Flora, y especialista en realización de perfiles de color para múltiples marcas y operación de NeoStampa.
          - Participación en 10 ediciones de Colombiatex y ferias como Inexmoda y Nextech, apoyando demostraciones técnicas, puesta a punto y soluciones de producción.
          - Diagnóstico de fallas eléctricas, electrónicas, neumáticas y de control en impresoras de gran formato, calandras térmicas y sistemas con PLC.

    Projects:
      - name: Convertidor DC-DC Boost Sincrónico de 75 W (12 V a 36 V) con Control en Doble Lazo
        start_date: 2026-08
        end_date: 2026-11
        summary: Trabajo integrador de Electrónica de Potencia (EPW103-1, ITM) basado en modelado en espacio de estados, simulación en MATLAB/PSIM e implementación digital en ESP32.
        highlights:
          - Lazos PI discretos multirrata en ESP32 (Núcleo 1 para control en corriente y tensión; Núcleo 0 para telemetría) mitigando el cero en el semiplano derecho (RHPZ).
          - Validación experimental en banco de pruebas con etapa sincrónica IRFZ44N, driver IR2110, sensor ACS712 y mediciones en osciloscopio R&S RTC1002.

    Skills:
      - label: Marcas y Software Industrial
        details: Mimaki (certificado), RasterLink (certificado), MS Italy (certificado), Monti Antonio SpA (certificado), Fedar (capacitado), Flora (capacitado), NeoStampa y perfiles de color multimarca.
      - label: Electrónica, Control y PLC
        details: Tecnólogo en Electrónica (ITM), proyectos en PLC, control aplicado, modelado en espacio de estados, control PI/PID, ESP32, MATLAB (sisotool) y PSIM.
      - label: Sector Ferial y Mantenimiento
        details: Más de 10 años de experiencia en campo, 10 ediciones de Colombiatex, Inexmoda, Nextech, diagnóstico eléctrico/electrónico y mantenimiento de maquinaria industrial.
