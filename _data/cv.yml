  image: ""
  summary: Tecnólogo en Electrónica y estudiante de Ingeniería en Electrónica en la Institución Universitaria ITM, con más de 10 años de experiencia en MECYS S.A.S. en diagnóstico eléctrico y electrónico, mantenimiento de maquinaria industrial de impresión digital y termofijación, gestión de perfiles de color con NeoStampa y RasterLink, y control en sistemas embebidos (ESP32) y PLC. Participación en 10 ediciones de Colombiatex y ferias del sector como Inexmoda y Nextech.

