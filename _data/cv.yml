        start_date: 2021-02
        end_date: present
        summary: Formación en electrónica de potencia, máquinas eléctricas, matemáticas especiales y control aplicado.
        highlights:
          - Proyecto integrador de convertidor DC-DC Boost sincrónico de 75 W (12 V a 36 V) con control PI en cascada en ESP32.
      - institution: Institución Universitaria ITM
